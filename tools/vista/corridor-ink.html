function archProfile(span, spring, apex, n = 28) {

  // left arc: passes through (-a, spring) and (0, apex), centre at (c, spring) with c = -a + R  (R = distance to (-a,spring))
  const c = -a + R;
  const a0 = Math.PI, a1 = Math.atan2(apex - spring, 0 - c);

  uniforms: { tDiffuse: { value: null }, tNormal: { value: normalRT.texture }, tDepth: { value: normalRT.depthTexture }, tPaper: { value: paperTex }, res: { value: new THREE.Vector2(W, H) }, cameraNear: { value: camera.near }, cameraFar: { value: camera.far }, ink: { value: +(P.get('ink') || 0.8) }, debug: { value: +(P.get('debug') || 0) }, wobble: { value: +(P.get('wobble') || 1.6) } },

  fragmentShader: `

    float lin(float z){ float n = cameraNear, f = cameraFar; float d = z * 2.0 - 1.0; return (2.0 * n * f) / (f + n - d * (f - n)); }

      vec3 nL = texture2D(tNormal, uv - ox).xyz, nR = texture2D(tNormal, uv + ox).xyz, nU = texture2D(tNormal, uv - oy).xyz, nD = texture2D(tNormal, uv + oy).xyz;
      float eN = clamp((length(nL - nC) + length(nR - nC) + length(nU - nC) + length(nD - nC)) * 0.9 - 0.35, 0.0, 1.0);

    }`

inkPass.uniforms.tNormal.value = normalRT.texture; inkPass.uniforms.tDepth.value = normalRT.depthTexture; inkPass.uniforms.tPaper.value = paperTex;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.25, 0.5, 0.9));
composer.addPass(inkPass);
composer.addPass(new OutputPass());
composer.render(); composer.render();
window.__done = true;
