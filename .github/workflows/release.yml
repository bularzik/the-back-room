name: Release Module

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Compile packs, validate, and package
        run: npm run package
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}

      - name: Attach module.json, module.zip and CHANGELOG.md; set the release notes from CHANGELOG.md
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/module.json
            dist/module.zip
            dist/CHANGELOG.md
