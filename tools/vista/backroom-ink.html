// pointed arch profile (two-centred), span RW, from springing to apex
function archProfile(span, spring, apex, n = 28) {
  const a = span / 2, h = apex - spring;
  const d = (h * h - a * a) / (2 * a);          // centre offset from midline (negative = inside)
  const R = a + d;
  const pts = [];
  const cL = new THREE.Vector2(-a + R, spring); // centre for the LEFT arc is on the right side... two-centred: left arc centre at (-a+R)?? -> compute properly
  // left arc: passes through (-a, spring) and (0, apex), centre at (c, spring) with c = -a + R  (R = distance to (-a,spring))
  const c = -a + R;
  const a0 = Math.PI, a1 = Math.atan2(apex - spring, 0 - c);
  for (let i = 0; i <= n; i++) { const t = a0 + (a1 - a0) * i / n; pts.push(new THREE.Vector2(c + R * Math.cos(t), spring + R * Math.sin(t))); }
  for (let i = n - 1; i >= 0; i--) { const p = pts[i]; pts.push(new THREE.Vector2(-p.x, p.y)); }
  return pts; // from (-a,spring) over apex to (a,spring)
}

// stained glass as photographed: a segmented rose (red/blue/green) with a red-and-white medallion, two quatrefoils (blue petals, red centres, green points) in grey tracery, three clear lancets below with daylight and brick buildings

    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + Math.PI / 8; disc(cx + Math.cos(a) * R * 0.62, cy + Math.sin(a) * R * 0.62, R * 0.14, WHITE); }

    g.strokeStyle = STONE; g.lineWidth = 14; g.beginPath(); g.arc(cx, cy, R + 7, 0, 7); g.stroke();

    for (const qx of [w * 0.19, w * 0.81]) { const qy = h * 0.38, r = w * 0.085;
      disc(qx, qy, r + 6, STONE, 2);
      for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; disc(qx + Math.cos(a) * r * 0.5, qy + Math.sin(a) * r * 0.5, r * 0.36, BLUE); }
      for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + Math.PI / 4; g.fillStyle = GREEN; g.beginPath(); g.moveTo(qx + Math.cos(a) * r * 0.45, qy + Math.sin(a) * r * 0.45); g.lineTo(qx + Math.cos(a + 0.35) * r * 0.95, qy + Math.sin(a + 0.35) * r * 0.95); g.lineTo(qx + Math.cos(a - 0.35) * r * 0.95, qy + Math.sin(a - 0.35) * r * 0.95); g.closePath(); g.fill(); g.strokeStyle = LEAD; g.lineWidth = 2; g.stroke(); }
      disc(qx, qy, r * 0.22, RED); disc(qx, qy, r * 0.1, WHITE, 2); }

  });
}
